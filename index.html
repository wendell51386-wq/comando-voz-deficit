<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comando de Voz - Controle de Déficit</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#1f2937}
.container{max-width:700px;margin:40px auto;padding:24px}
.card{background:#fff;border-radius:18px;padding:32px;box-shadow:0 6px 24px rgba(0,0,0,.10);text-align:center}
h1{margin-top:0;font-size:28px}.sub{color:#6b7280;margin-bottom:28px}
button{border:0;border-radius:12px;padding:15px 22px;font-size:17px;font-weight:bold;cursor:pointer;margin:5px}
#btn{background:#2e7d32;color:#fff}.confirmar{background:#166534;color:#fff}.cancelar{background:#6b7280;color:#fff}
button:disabled{opacity:.6;cursor:wait}
.box{margin-top:20px;padding:18px;border-radius:12px;background:#f8fafc;text-align:left;min-height:50px;white-space:pre-wrap}
.label{font-size:13px;font-weight:bold;color:#6b7280;text-transform:uppercase;margin-bottom:7px}
#confirmacao{display:none;margin-top:20px;padding:18px;border-radius:12px;background:#fff7ed;border:1px solid #fed7aa;text-align:center}
.erro{color:#b91c1c}
</style>
</head>
<body>
<div class="container">
<div class="card">
<h1>🎤 Comando de Voz</h1>
<div class="sub">Consulte, navegue e lance dados na planilha por voz.</div>
<button id="btn" onclick="ouvir()">🎤 FALAR</button>
<div class="box"><div class="label">Você disse</div><div id="texto">Aguardando comando...</div></div>
<div class="box"><div class="label">Resposta</div><div id="resposta">Aguardando...</div></div>
<div id="confirmacao">
  <div id="textoConfirmacao"></div>
  <div style="margin-top:14px">
    <button class="confirmar" onclick="confirmarLancamento()">✅ CONFIRMAR</button>
    <button class="cancelar" onclick="cancelarLancamento()">❌ CANCELAR</button>
  </div>
</div>
</div>
</div>
<script>
// URL FIXA DA IMPLANTAÇÃO DO APPS SCRIPT.
// Não usa ${urPlanilha}, parâmetros de template ou URL da planilha.
const API_URL='https://script.google.com/macros/s/AKfycbzuO14e0u6SlUFgfO7SNbTNX0mN0k_V6kTG6QSmCcAW5dPoQTn3ITGOTi2cAJU71la9-A/exec';
let lancamentoPendente=null;

function setTexto(v,erro=false){
  const e=document.getElementById('texto');e.textContent=v;e.className=erro?'erro':'';
}
function setResposta(v,erro=false){
  const e=document.getElementById('resposta');e.textContent=v;e.className=erro?'erro':'';
}
function esconderConfirmacao(){document.getElementById('confirmacao').style.display='none';}

function ouvir(){
  esconderConfirmacao();
  lancamentoPendente=null;
  const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!Recognition){setResposta('O navegador não oferece reconhecimento de voz.',true);return;}
  const btn=document.getElementById('btn');
  btn.disabled=true;btn.textContent='🎙️ OUVINDO...';
  setTexto('Fale agora...');setResposta('Processando...');
  const r=new Recognition();
  r.lang='pt-BR';r.continuous=false;r.interimResults=false;r.maxAlternatives=1;
  r.onresult=e=>{const t=e.results[0][0].transcript.trim();setTexto(t);consultarAPI(t);};
  r.onerror=e=>{setResposta('Erro no reconhecimento: '+e.error,true);btn.disabled=false;btn.textContent='🎤 FALAR';};
  r.onend=()=>{btn.disabled=false;btn.textContent='🎤 FALAR';};
  try{r.start();}catch(e){setResposta('Não foi possível iniciar o microfone: '+e.message,true);btn.disabled=false;btn.textContent='🎤 FALAR';}
}

function jsonp(params,done){
  const cb='respostaVoz_'+Date.now()+'_'+Math.floor(Math.random()*10000);
  const s=document.createElement('script');
  params.callback=cb;
  window[cb]=function(resultado){try{done(resultado);}finally{delete window[cb];s.remove();}};
  s.onerror=function(){setResposta('Não foi possível comunicar com o Apps Script.',true);delete window[cb];s.remove();};
  const query=Object.keys(params).map(k=>encodeURIComponent(k)+'='+encodeURIComponent(params[k])).join('&');
  s.src=API_URL+'?'+query;
  document.body.appendChild(s);
}

function consultarAPI(texto){
  jsonp({api:'voz',texto:texto},function(resultado){
    if(!resultado){setResposta('Resposta inválida do servidor.',true);return;}

    if(resultado.acao==='confirmar_lancamento' && resultado.sucesso){
      lancamentoPendente={
        instituicao:resultado.instituicao,
        disciplina:resultado.disciplina,
        periodo:resultado.periodo,
        quantidade:resultado.quantidade,
        modo:resultado.modo,
        linha:resultado.linha
      };
      setResposta(resultado.resposta);
      document.getElementById('textoConfirmacao').textContent=resultado.resposta;
      document.getElementById('confirmacao').style.display='block';
      return;
    }

    if(resultado.acao==='abrir_quantitativos' && resultado.sucesso && resultado.url){
      setResposta(resultado.resposta+'\n\nAbrindo Quantitativos...');
      setTimeout(()=>{window.location.href=resultado.url;},700);
      return;
    }

    setResposta(resultado.resposta||'Não foi possível processar o comando.',!resultado.sucesso);
  });
}

function confirmarLancamento(){
  if(!lancamentoPendente)return;

  const p=lancamentoPendente;

  esconderConfirmacao();
  setResposta('Gravando na aba Quantitativos...');

  jsonp({
    api:'voz',
    confirmar:'1',
    linha:p.linha,
    quantidade:p.quantidade,
    modo:p.modo
  },function(resultado){

    lancamentoPendente=null;

    if(resultado&&resultado.sucesso){

      setResposta(
        resultado.resposta ||
        'Lançamento realizado com sucesso.'
      );

      if(resultado.url){
        setTimeout(()=>{
          window.location.href=resultado.url;
        },700);
      }

      return;
    }

    setResposta(
      resultado&&resultado.resposta
        ? resultado.resposta
        : 'Não foi possível realizar o lançamento.',
      true
    );

  });
}

function cancelarLancamento(){
  lancamentoPendente=null;
  esconderConfirmacao();
  setResposta('Lançamento cancelado. Nenhum dado foi alterado.');
}
</script>
</body>
</html>
